<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>NFC Smart Card</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- ضع كود الحماية هنا -->
</head>
<body class="bg-[#050505] text-white min-h-screen flex items-center justify-center">

    <!-- شاشة التحميل -->
    <div id="loader" class="text-gold text-2xl">جاري قراءة الكارت...</div>

    <!-- 1. نموذج إعداد المطعم (يظهر لأول مرة فقط) -->
    <div id="setupForm" class="hidden w-full max-w-md p-8 bg-gray-900 rounded-2xl">
        <h2 class="text-2xl font-bold text-gold mb-4">إعداد الكارت الجديد</h2>
        <p class="text-sm text-gray-400 mb-6">أدخل بيانات مطعمك الأساسية لتفعيل الكارت.</p>
        
        <input type="text" id="restName" placeholder="اسم المطعم" class="w-full p-3 mb-4 bg-black border border-gray-700 rounded text-white">
        <input type="tel" id="restPhone" placeholder="رقم الهاتف (مثال: 01206244875)" class="w-full p-3 mb-4 bg-black border border-gray-700 rounded text-white">
        
        <button onclick="setupNewCard()" class="w-full p-3 bg-yellow-600 text-black font-bold rounded">حفظ وتفعيل الكارت</button>
    </div>

    <!-- 2. بطاقة بيانات الدخول (تظهر لمرة واحدة بعد الحفظ) -->
    <div id="credentialsCard" class="hidden w-full max-w-md p-8 bg-green-900/20 border border-green-500 rounded-2xl text-center">
        <h2 class="text-2xl font-bold text-green-400 mb-4">تم التفعيل بنجاح! 🎉</h2>
        <p class="text-sm text-gray-300 mb-4">الرجاء تصوير هذه الشاشة، لن تظهر مرة أخرى.</p>
        <div class="bg-black p-4 rounded mb-4 text-left dir-ltr">
            <p class="text-gray-400">Email: <span id="genEmail" class="text-white font-bold"></span></p>
            <p class="text-gray-400">Password: <span id="genPass" class="text-white font-bold"></span></p>
        </div>
        <a href="login.html" class="block w-full p-3 bg-green-600 text-white font-bold rounded">الذهاب للوحة التحكم</a>
    </div>

    <!-- 3. واجهة المطعم الفاخرة (تم إخفاء زر الإدارة منها) -->
    <div id="publicView" class="hidden w-full">
        <!-- ضع هنا كود الـ HTML الخاص بواجهة المطعم الفاخرة التي صممناها سابقاً -->
        <!-- ملاحظة: لا تضع زر الإدارة (الترس) هنا أبداً -->
    </div>

    <!-- Firebase Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBvIUJRs5tStQ8vqmsfEd7eOF0ptyjk8Ts",
            authDomain: "ma-smart-promo.firebaseapp.com",
            databaseURL: "https://ma-smart-promo-default-rtdb.firebaseio.com",
            projectId: "ma-smart-promo",
            storageBucket: "ma-smart-promo.firebasestorage.app",
            messagingSenderId: "389479043172",
            appId: "1:389479043172:web:02205a57410972ffc9cf71",
            measurementId: "G-QF6BXWELBX"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // استخراج ID الكارت من الرابط (مثال: ?card=12345)
        const urlParams = new URLSearchParams(window.location.search);
        const cardId = urlParams.get('card');

        async function checkCard() {
            if(!cardId) return alert("رابط غير صالح");
            
            const cardRef = doc(db, "cards", cardId);
            const cardSnap = await getDoc(cardRef);

            document.getElementById('loader').classList.add('hidden');

            if (cardSnap.exists()) {
                const cardData = cardSnap.data();
                if (cardData.status === 'pending') {
                    // الكارت جديد -> إظهار نموذج الإعداد
                    document.getElementById('setupForm').classList.remove('hidden');
                } else {
                    // الكارت مفعل -> جلب بيانات المطعم وعرض الواجهة الفاخرة
                    fetchAndShowRestaurant(cardData.ownerId);
                }
            } else {
                alert("هذا الكارت غير مسجل في النظام");
            }
        }

        window.setupNewCard = async function() {
            const name = document.getElementById('restName').value;
            const phone = document.getElementById('restPhone').value;
            
            if(!name || !phone) return alert("أكمل البيانات");

            // توليد إيميل وباسورد
            const email = `${phone}@am.smart.promo.com`;
            const password = Math.floor(10000000 + Math.random() * 90000000).toString(); // 8 أرقام عشوائية

            try {
                // 1. إنشاء الحساب
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const uid = userCredential.user.uid;

                // 2. حفظ بيانات المطعم
                await setDoc(doc(db, "restaurants", uid), {
                    name: name,
                    phone: phone,
                    cardId: cardId,
                    createdAt: new Date()
                });

                // 3. تحديث حالة الكارت
                await updateDoc(doc(db, "cards", cardId), {
                    status: 'active',
                    ownerId: uid
                });

                // 4. إظهار بيانات الدخول
                document.getElementById('setupForm').classList.add('hidden');
                document.getElementById('credentialsCard').classList.remove('hidden');
                
                document.getElementById('genEmail').innerText = email;
                document.getElementById('genPass').innerText = password;

            } catch (error) {
                alert("حدث خطأ: " + error.message);
            }
        }

        async function fetchAndShowRestaurant(uid) {
            // هنا تقوم بجلب بيانات المطعم من Firestore وحقنها في الـ HTML الفاخر
            document.getElementById('publicView').classList.remove('hidden');
            // ... كود حقن البيانات الذي كتبناه سابقاً ...
        }

        checkCard();
    </script>
</body>
</html>
