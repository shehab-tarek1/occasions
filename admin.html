<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#050505] text-white min-h-screen">

    <!-- 1. شاشة التحميل (تظهر أولاً) -->
    <div id="loader" class="fixed inset-0 bg-[#050505] z-50 flex flex-col items-center justify-center">
        <div class="w-12 h-12 border-4 border-gold border-t-transparent rounded-full animate-spin mb-4"></div>
        <p class="text-gold text-xl font-bold">جاري التحقق من الصلاحيات...</p>
    </div>

    <!-- 2. لوحة المدير العام (Super Admin) -->
    <div id="superAdminPanel" class="hidden p-10">
        <h1 class="text-3xl font-bold text-gold mb-6">لوحة الإدارة العليا</h1>
        <button onclick="generateNewCard()" class="bg-green-600 text-white px-6 py-3 rounded-xl font-bold mb-6">
            + توليد كارت NFC جديد
        </button>
        <div id="newCardLink" class="hidden p-4 bg-gray-900 border border-green-500 rounded-xl mb-6">
            <p class="text-sm text-gray-400 mb-2">انسخ هذا الرابط وقم ببرمجته داخل شريحة الـ NFC:</p>
            <input type="text" id="generatedLink" class="w-full p-2 bg-black text-green-400 rounded" readonly>
        </div>
    </div>

    <!-- 3. لوحة صاحب المطعم (التصميم الفاخر الذي صنعناه) -->
    <div id="restaurantPanel" class="hidden">
        <!-- ضع هنا كود الـ HTML الخاص بلوحة تحكم المطعم الفاخرة (بدون الـ body والـ head) -->
        <div class="p-10 text-center">
            <h1 class="text-2xl text-gold">مرحباً بك في لوحة تحكم مطعمك</h1>
            <!-- باقي تصميم المطعم هنا -->
        </div>
    </div>

    <!-- Firebase Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBvIUJRs5tStQ8vqmsfEd7eOF0ptyjk8Ts",
            authDomain: "ma-smart-promo.firebaseapp.com",
            databaseURL: "https://ma-smart-promo-default-rtdb.firebaseio.com",
            projectId: "ma-smart-promo",
            storageBucket: "ma-smart-promo.firebasestorage.app",
            messagingSenderId: "389479043172",
            appId: "1:389479043172:web:02205a57410972ffc9cf71"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const SUPER_ADMIN_UID = "Mxv1SpzNDfNpQNt9ndhZQ9ayETS2";

        // التحقق من حالة تسجيل الدخول
        onAuthStateChanged(auth, (user) => {
            const loader = document.getElementById('loader');
            
            if (user) {
                loader.classList.add('hidden'); // إخفاء اللودينج
                
                if (user.uid === SUPER_ADMIN_UID) {
                    // إظهار لوحة المدير العام
                    document.getElementById('superAdminPanel').classList.remove('hidden');
                } else {
                    // إظهار لوحة المطعم
                    document.getElementById('restaurantPanel').classList.remove('hidden');
                    // هنا يمكنك استدعاء دالة لجلب بيانات المطعم من Firestore
                }
            } else {
                // إذا لم يكن مسجلاً للدخول، تحويله لصفحة تسجيل الدخول
                window.location.href = "login.html";
            }
        });

        // دالة توليد كارت جديد (للمدير العام فقط)
        window.generateNewCard = async function() {
            try {
                const docRef = await addDoc(collection(db, "cards"), {
                    status: "pending",
                    createdAt: new Date()
                });
                
                const linkBox = document.getElementById('newCardLink');
                const linkInput = document.getElementById('generatedLink');
                
                // إنشاء الرابط بناءً على الدومين الحالي
                const currentDomain = window.location.origin;
                linkInput.value = `${currentDomain}/index.html?card=${docRef.id}`;
                
                linkBox.classList.remove('hidden');
            } catch (e) {
                alert("حدث خطأ أثناء توليد الكارت: " + e.message);
            }
        }
    </script>
</body>
</html>
