<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تسجيل الدخول</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#050505] text-white min-h-screen flex items-center justify-center">
    
    <div class="bg-gray-900 p-8 rounded-2xl w-full max-w-sm border border-gray-800 shadow-2xl">
        <h2 class="text-2xl font-bold text-gold mb-6 text-center">تسجيل الدخول</h2>
        
        <input type="email" id="email" placeholder="البريد الإلكتروني" class="w-full p-3 mb-4 bg-black border border-gray-700 rounded text-white text-left" dir="ltr">
        <input type="password" id="pass" placeholder="كلمة المرور" class="w-full p-3 mb-6 bg-black border border-gray-700 rounded text-white text-left" dir="ltr">
        
        <button onclick="login()" id="loginBtn" class="w-full p-3 bg-gradient-to-r from-yellow-600 to-yellow-500 text-black font-bold rounded-xl">
            دخول
        </button>
        <p id="errorMsg" class="text-red-500 text-sm mt-4 text-center hidden"></p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBvIUJRs5tStQ8vqmsfEd7eOF0ptyjk8Ts",
            authDomain: "ma-smart-promo.firebaseapp.com",
            projectId: "ma-smart-promo",
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        window.login = async function() {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('pass').value;
            const btn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('errorMsg');
            
            if(!email || !pass) return;

            btn.innerText = "جاري الدخول...";
            errorMsg.classList.add('hidden');

            try {
                await signInWithEmailAndPassword(auth, email, pass);
                window.location.href = "admin.html"; // توجيه للوحة التحكم بعد النجاح
            } catch(e) {
                btn.innerText = "دخول";
                errorMsg.innerText = "بيانات الدخول غير صحيحة!";
                errorMsg.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
